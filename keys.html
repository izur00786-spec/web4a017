<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinta Abadi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fff 0%, #ffeef8 50%, #ffd1e0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 182, 193, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 192, 203, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 105, 180, 0.2) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(1deg); }
            66% { transform: translateY(-10px) rotate(-1deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 
                0 25px 50px rgba(255, 105, 180, 0.2),
                0 15px 35px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            max-width: 700px;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 2px solid rgba(255, 182, 193, 0.4);
        }

        .heart {
            font-size: 4rem;
            color: #ff69b4;
            margin-bottom: 20px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-size: 2.2rem;
            color: #ff1493;
            margin-bottom: 30px;
            font-weight: normal;
            text-shadow: 0 2px 4px rgba(255, 105, 180, 0.3);
        }

        .love-text {
            font-size: 1.4rem;
            line-height: 1.8;
            color: #333;
            margin-bottom: 30px;
            font-style: italic;
        }

        .love-text strong {
            color: #ff69b4;
            font-weight: bold;
        }

        .pink-line {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #ff69b4, #ffb6c1);
            margin: 30px auto;
            border-radius: 2px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 5px rgba(255, 105, 180, 0.5); }
            to { box-shadow: 0 0 20px rgba(255, 105, 180, 0.8); }
        }

        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .heart-float {
            position: absolute;
            color: rgba(255, 105, 180, 0.6);
            font-size: 1.2rem;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) scale(1);
            }
            90% {
                opacity: 1;
                transform: translateY(-10vh) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-20vh) scale(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 25px;
                margin: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .love-text {
                font-size: 1.2rem;
            }
            
            .heart {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>
    
    <div class="container">
        <div class="heart">💖</div>
        <h1>Cinta Yang Tak Pernah Berubah</h1>
        <div class="love-text">
            "Aku gatau caraku mencintaimu itu sudah sesuai dengan keinginan mu apa tidak, 
            tapi percaya deh bae, 
            <strong>I love u more than anything</strong>, 
            even suatu saat kamu berubah jadi ugly monster, 
            <strong>I be there and I still love you</strong>"
        </div>
        <div class="pink-line"></div>
    </div>

    <script>
        // Membuat hati mengambang
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-float';
            heart.innerHTML = '💕';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.getElementById('floatingHearts').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        // Membuat hati setiap 500ms
        setInterval(createFloatingHeart, 500);

        // Efek klik untuk hati tambahan
        document.addEventListener('click', function(e) {
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.style.position = 'fixed';
            heart.style.left = e.clientX + 'px';
            heart.style.top = e.clientY + 'px';
            heart.style.fontSize = '2rem';
            heart.style.pointerEvents = 'none';
            heart.style.zIndex = '9999';
            heart.style.animation = 'floatUp 3s linear forwards';
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 3000);
        });
    </script>
</body>
</html>
